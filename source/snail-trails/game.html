<!-- Snail Trails: written directly for Pip's Learning Garden (uses the shared Pip core, no standalone version) -->
<style>
/* Layout: a sheet of school handwriting paper (solid top line, dashed middle, solid base) on a garden path.
   She drags the snail along each stroke; it leaves a shiny purple trail. Fixed bright colours. */
:host {
  --bg-top: #efe6ff;
  --bg-low: #e2f5e6;
  --leaf: #59ad6c;
  --ink: #2a2a4a;
  --ink-soft: #5a5a78;
  --paper: #ffffff;
  --paper-edge: #ddd3ee;
  --line: #8fb4e3;
  --line-mid: #b9d0ee;
  --guide: #e7e0f4;
  --guide-dot: #b7a6d8;
  --trail: #8e5cd9;
  --go: #2c9c5a;
  --berry: #d9466f;
  --sun: #ffc93d;
  --font-display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-read: "Andika", "Century Gothic", "Segoe UI", system-ui, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  display: block; height: 100%;
  font-family: var(--font-read); font-size: 18px; color: var(--ink);
  background: linear-gradient(180deg, var(--bg-top), var(--bg-low));
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--berry); outline-offset: 4px; }
.emoji { font-family: var(--emoji); line-height: 1; }

.scenery { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.leafy { position: absolute; width: 90px; height: 46px; background: var(--leaf); border-radius: 0 100% 0 100%; opacity: .35; }
.lf1 { left: -20px; bottom: 8%; transform: rotate(-18deg); }
.lf2 { right: -14px; top: 18%; transform: rotate(150deg); }

#app { position: relative; height: 100%; }
.screen {
  height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.center { justify-content: center; text-align: center; }
.pip { font-family: var(--emoji); line-height: 1; border: 0; border-radius: 50%; background: var(--paper); display: grid; place-items: center; box-shadow: 0 6px 0 var(--paper-edge); flex: none; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(42px, 6vw, 68px); line-height: .95; margin: 0; color: var(--paper);
  text-shadow: 0 4px 0 var(--trail), 3px 0 0 var(--trail), -3px 0 0 var(--trail), 0 -3px 0 var(--trail), 3px 4px 0 var(--trail), -3px 4px 0 var(--trail); }
h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 4vw, 44px); margin: 0; line-height: 1.1; text-wrap: balance; }
.pill { border: 0; border-radius: 999px; padding: 12px 22px; background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge);
  font-family: var(--font-display); font-weight: 800; font-size: 22px; display: inline-flex; align-items: center; gap: 10px; transition: transform .12s; }
.pill:hover { transform: translateY(-3px); }
.pill .emoji { font-size: 26px; }
.badge { background: var(--sun); border-radius: 999px; padding: 0 10px; font-size: 18px; }
.round-btn { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge); font-family: var(--emoji); font-size: 28px; display: grid; place-items: center; flex: none; }
.paws { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.paw { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.6); border: 3px dashed rgba(42,42,74,.22); display: grid; place-items: center; font-family: var(--emoji); font-size: 20px; }
.paw.got { background: var(--paper); border: 3px solid var(--paper-edge); animation: pop .4s ease; }
.paw.gold { background: var(--sun); border-color: #e9a800; }
.btn-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

/* Home */
.home-head { display: flex; align-items: center; gap: 18px; margin-top: 2vh; }
.home-head .pip { width: 104px; height: 104px; font-size: 66px; }
.home-sub { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 6px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 210px)); gap: 22px; justify-content: center; width: 100%; margin-top: 3vh; }
.tile { border: 0; border-radius: 34px; padding: 18px 12px 14px; background: var(--paper); box-shadow: 0 10px 0 var(--edge), 0 14px 24px rgba(42,42,74,.14);
  display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 220px; transition: transform .15s; }
.tile:hover { transform: translateY(-6px) rotate(-1.5deg); }
.tile-art { width: 100%; flex: 1; border-radius: 24px; background: var(--wash); display: grid; place-items: center; min-height: 128px; padding: 8px; text-align: center;
  font-family: var(--font-read); font-weight: 700; font-size: 52px; color: var(--trail); }
.tile-art small { display: block; font-size: 15px; color: var(--ink-soft); font-weight: 400; }
.tile-name { font-family: var(--font-display); font-weight: 800; font-size: 25px; line-height: 1; }
.t-big { --wash: #efe6ff; --edge: #b49be4; }
.t-small { --wash: #e2f1ff; --edge: #8fb4e3; }
.t-num { --wash: #fff0c4; --edge: #f0c24a; }
.t-name { --wash: #ffe0e8; --edge: #ef8fa3; }
.t-name .tile-art { font-size: clamp(26px, 2.6vw, 36px); color: var(--berry); word-break: break-word; }
.home-foot { margin-top: auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }

/* Play */
.topbar { width: 100%; max-width: 1080px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bubble-row { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 1080px; }
.bubble-row .pip { width: 66px; height: 66px; font-size: 44px; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--paper); border-radius: 24px; padding: 12px 22px;
  font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 2.8vw, 32px); line-height: 1.15; box-shadow: 0 6px 0 var(--paper-edge); text-wrap: balance; }
.bubble::before { content: ""; position: absolute; left: -14px; top: 50%; margin-top: -12px; border: 12px solid transparent; border-right: 16px solid var(--paper); border-left: 0; }
.desk { flex: 1; min-height: 0; width: 100%; max-width: 1080px; display: flex; align-items: center; justify-content: center; gap: 4vw; }
.board { height: min(calc(100vh - 230px), 540px); aspect-ratio: 140 / 160; max-width: 100%; flex: none;
  background: var(--paper); border-radius: 24px; box-shadow: 0 10px 0 var(--paper-edge), 0 14px 26px rgba(42,42,74,.14); touch-action: none; cursor: pointer; }
.board.oops { animation: shake .3s ease; }
.side { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.model { background: var(--paper); border-radius: 26px; padding: 4px 34px 10px; box-shadow: 0 8px 0 var(--paper-edge); font-family: var(--font-read); font-weight: 700;
  font-size: clamp(80px, 13vh, 130px); line-height: 1.1; color: var(--trail); min-width: 1.4em; text-align: center; }
.model small { display: block; font-family: var(--font-display); font-size: 18px; color: var(--ink-soft); line-height: 1; padding-bottom: 4px; }
.strip { display: flex; gap: 4px; background: var(--paper); border-radius: 16px; padding: 4px 14px; box-shadow: 0 5px 0 var(--paper-edge);
  font-family: var(--font-read); font-weight: 700; font-size: clamp(28px, 4vw, 40px); }
.strip span { color: #cfc6e0; }
.strip span.done { color: var(--ink); }
.strip span.now { color: var(--trail); text-decoration: underline; text-underline-offset: 6px; }

/* the writing paper */
.paper-line { stroke: var(--line); stroke-width: .9; }
.paper-mid { stroke: var(--line-mid); stroke-width: .8; stroke-dasharray: 3 3; }
.paper-desc { stroke: #e6eef8; stroke-width: .8; }
.guide { fill: none; stroke: var(--guide); stroke-linecap: round; stroke-linejoin: round; }
.guide.dotted { stroke: var(--guide-dot); stroke-dasharray: .1 4.2; }
.guide-dot { fill: var(--guide); }
.trail { fill: none; stroke: var(--trail); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.trail.done { stroke: var(--ink); stroke-width: 6; }
.start circle { fill: var(--go); }
.start text { fill: #fff; font-family: var(--font-display); font-weight: 800; font-size: 7px; text-anchor: middle; dominant-baseline: central; }
.start .pulse { fill: none; stroke: var(--go); stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: ring 1.4s ease-out infinite; }
.arrowhead { fill: var(--go); }
.snail { font-family: var(--emoji); font-size: 13px; text-anchor: middle; dominant-baseline: central; }
.snail-g.wobble { animation: wobble .4s ease; }

/* Reward + book */
.eyebrow { font-family: var(--font-display); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 18px; margin: 0; color: var(--ink-soft); }
.sticker-big { font-family: var(--emoji); font-size: clamp(110px, 17vw, 170px); line-height: 1; width: clamp(170px, 26vw, 250px); aspect-ratio: 1; border-radius: 50%;
  background: var(--paper); display: grid; place-items: center; border: 8px dashed var(--trail); box-shadow: 0 12px 0 rgba(42,42,74,.1); animation: sticker .9s cubic-bezier(.2, 1.6, .4, 1) both; }
.book-head { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 900px; }
.book-head h2 { flex: 1; }
.book { width: 100%; max-width: 900px; background: var(--paper); border-radius: 34px; padding: 22px; box-shadow: 0 10px 0 var(--paper-edge);
  display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px; }
.slotb { position: relative; aspect-ratio: 1; border: 0; border-radius: 24px; background: #f4f0fb; display: grid; place-items: center; font-family: var(--emoji); font-size: 54px; line-height: 1; }
.slotb.have { background: #fff4d0; }
.slotb.empty span { filter: grayscale(1) brightness(0); opacity: .12; }
.slotb .n { position: absolute; bottom: 6px; right: 8px; font-family: var(--font-display); font-weight: 800; font-size: 16px; background: var(--sun); border-radius: 999px; padding: 0 8px; }

.bit { position: fixed; width: 12px; height: 12px; border-radius: 3px; z-index: 7; pointer-events: none; animation: burst .9s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.5); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes ring { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
@keyframes wobble { 0%, 100% { transform: translate(var(--x), var(--y)) rotate(0); } 30% { transform: translate(var(--x), var(--y)) rotate(-18deg); } 70% { transform: translate(var(--x), var(--y)) rotate(18deg); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-5px); } 70% { transform: translateX(5px); } }
@keyframes sticker { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }

@media (max-width: 860px) { .tiles { grid-template-columns: repeat(2, minmax(0, 210px)); } .desk { flex-direction: column; gap: 10px; } }
/* Phone held sideways (about 760 x 360) */
@media (max-height: 520px) {
  .screen { gap: 6px; padding-block: 6px; }
  .round-btn { width: 44px; height: 44px; font-size: 21px; box-shadow: 0 4px 0 var(--paper-edge); }
  .paws { gap: 5px; }
  .paw { width: 28px; height: 28px; font-size: 14px; border-width: 2px; }
  .bubble-row .pip { width: 44px; height: 44px; font-size: 30px; box-shadow: 0 4px 0 var(--paper-edge); }
  .bubble { font-size: 19px; padding: 6px 14px; border-radius: 16px; box-shadow: 0 4px 0 var(--paper-edge); }
  .bubble::before { left: -10px; margin-top: -8px; border-width: 8px; border-right-width: 11px; }
  h1 { font-size: 34px; }
  h2 { font-size: 24px; }
  .home-head { margin-top: 0; gap: 12px; }
  .home-head .pip { width: 64px; height: 64px; font-size: 42px; box-shadow: 0 4px 0 var(--paper-edge); }
  .home-sub { font-size: 17px; margin-top: 2px; }
  .tiles { margin-top: 4px; gap: 12px; grid-template-columns: repeat(4, minmax(0, 170px)); }
  .tile { min-height: 0; padding: 8px; border-radius: 24px; gap: 6px; box-shadow: 0 7px 0 var(--edge), 0 10px 18px rgba(0, 0, 0, .12); }
  .tile-art { min-height: 92px; border-radius: 18px; font-size: 38px; }
  .tile-name { font-size: 18px; }
  .pill { padding: 8px 16px; font-size: 17px; }
  .pill .emoji { font-size: 22px; }
  .desk { flex-direction: row; gap: 28px; }
  .board { height: calc(100vh - 112px); border-radius: 16px; box-shadow: 0 6px 0 var(--paper-edge); }
  .model { font-size: 64px; padding: 2px 22px 6px; border-radius: 18px; box-shadow: 0 5px 0 var(--paper-edge); }
  .model small { font-size: 14px; }
  .strip { font-size: 24px; padding: 2px 10px; border-radius: 12px; }
  .side { gap: 8px; }
  .sticker-big { width: 120px; font-size: 76px; border-width: 6px; }
  .eyebrow { font-size: 14px; }
  .book { padding: 14px; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
  .slotb { font-size: 42px; border-radius: 18px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

    <div class="bubble-row">

</div>

    x: ["M28 70 L72 120", "M72 70 L28 120"],
    y: ["M28 70 L50 118", "M72 70 L38 155"],
    z: ["M28 70 L72 70 L28 120 L72 120"],
    0: ["M50 20 C18 20 18 120 50 120 C82 120 82 20 50 20"],
    1: ["M34 36 L52 20 L52 120"],
    2: ["M26 42 C28 12 78 12 76 44 C74 70 32 94 26 120 L78 120"],
    3: ["M26 34 C36 12 76 14 74 44 C72 64 52 70 44 70 C80 70 84 120 50 120 C36 120 26 112 22 104"],
    4: ["M58 20 L22 90 L80 90", "M62 44 L62 120"],
    5: ["M32 20 L28 66 C46 52 78 58 78 90 C78 126 36 126 24 108", "M32 20 L72 20"],
    6: ["M70 26 C46 10 22 38 22 80 C22 124 78 126 78 92 C78 62 30 62 24 88"],
    7: ["M22 20 L78 20 L40 120"],
    8: ["M68 34 C62 14 30 16 30 40 C30 62 72 64 72 92 C72 124 28 124 28 94 C28 66 70 62 70 40"],
    9: ["M74 46 C74 16 26 16 26 46 C26 76 74 76 74 46 L74 120"]
  };
  // Level 1 starts with the shapes made of straight lines (and circles for small letters)
  const SETS = {
    big: { 1: "LTIHFEVXZ", 2: "ABCDEFGHIJKLMNOPQRSTUVWXYZ" },
    small: { 1: "iltvwxzoc", 2: "abcdefghijklmnopqrstuvwxyz" },
    numbers: { 1: "01478", 2: "0123456789" }
  };
  const ID_PREFIX = { big: "up:", small: "low:", numbers: "num:" };
  // how close the finger must stay to the line (in board units; a letter is 100 tall)
  const TOL = { 1: 16, 2: 13, 3: 10 };
  const STICKERS = [
    ["🦁", "lion"], ["🐯", "tiger"], ["🐻", "bear"], ["🐼", "panda"], ["🐨", "koala"], ["🐵", "monkey"],
    ["🦊", "fox"], ["🐰", "bunny"], ["🐸", "frog"], ["🐷", "pig"], ["🐮", "cow"], ["🐔", "hen"],
    ["🐧", "penguin"], ["🦉", "owl"], ["🦄", "unicorn"], ["🐙", "octopus"], ["🐳", "whale"], ["🐬", "dolphin"],
    ["🦒", "giraffe"], ["🦓", "zebra"], ["🐘", "elephant"], ["🦛", "hippo"], ["🐢", "turtle"], ["🦜", "parrot"]
  ];

  /* ---------- Sound effects ---------- */
  let actx = null;
  function tone(f, t, d, type = "triangle", v = 0.15) {
    v *= window.speechSynthesis && speechSynthesis.speaking ? 0.3 : 0.6;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.05);
  }
  function sfx(kind) {
    if (!Pip.settings.sfx) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const now = actx.currentTime;
      if (kind === "stroke") [659, 880].forEach((f, i) => tone(f, now + i * 0.08, 0.16));
      else if (kind === "yes") [523, 659, 784, 1047].forEach((f, i) => tone(f, now + i * 0.09, 0.2));
      else if (kind === "no") tone(220, now, 0.18, "sine", 0.1);
      else if (kind === "fanfare") [523, 659, 784, 1047].forEach((f, i) => tone(f, now + i * 0.13, i === 3 ? 0.6 : 0.16));
    } catch (e) {}
  }
  function confetti(el) {
    if (reduceMotion || !el) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const colors = ["#8e5cd9", "#ffc93d", "#2f7de1", "#3bb273", "#d9466f"];
    for (let i = 0; i < 24; i++) {
      const b = document.createElement("span"); b.className = "bit";
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 130;
      b.style.left = cx + "px"; b.style.top = cy + "px"; b.style.background = pick(colors);
      b.style.setProperty("--dx", Math.cos(a) * d + "px"); b.style.setProperty("--dy", Math.sin(a) * d - 40 + "px");
      root.appendChild(b); setTimeout(() => b.remove(), 950);
    }
  }

  /* ---------- Screens ---------- */
  const screens = ["home", "play", "reward", "book"];
  function show(id) { screens.forEach(s => { $("#" + s).hidden = s !== id; }); }
  let interacted = false;
  window.addEventListener("pointerdown", () => { interacted = true; }, { once: true });

  function renderHome() {
    root.querySelectorAll(".tile").forEach(t => { t.hidden = settings.enabled[t.dataset.act] === false; });
    const first = Pip.settings.first.trim();
    $("#nameArt").innerHTML = first ? first.replace(/</g, "&lt;") : `<small>Ask a grown-up to add your name</small>`;
    $("#stickerCount").textContent = Object.keys(stickers).length;
  }
  function goHome(speak = true) { game = null; T = null; stopSpeech(); renderHome(); show("home"); if (speak && interacted) say("What shall we write?"); }
  const tileWords = { big: "Big letters!", small: "Small letters!", numbers: "Numbers!", name: "Write your name!" };
  root.querySelectorAll(".tile").forEach(t => {
    t.addEventListener("mouseenter", () => { if (interacted && !game) say(tileWords[t.dataset.act]); });
    t.addEventListener("click", () => startRound(t.dataset.act));
  });
  $("#pipHome").addEventListener("click", () => say("Hi! Put your finger on the green dot, and help the snail draw the letter."));

  /* ---------- Rounds ---------- */
  let game = null;   // round
  let T = null;      // the letter being traced

  function buildRound(act) {
    const lv = levels[act];
    if (act === "name") {
      return [...Pip.settings.first.trim()].filter(c => /\p{L}/u.test(c)).slice(0, 10)
        .map(c => ({ ch: base(c), show: c, id: null })).filter(it => GLYPHS[it.ch]);
    }
    const set = SETS[act][lv === 1 ? 1 : 2];
    return memory.pick([...set].map(c => ID_PREFIX[act] + c), 5).map(id => {
      const ch = id.slice(ID_PREFIX[act].length);
      return { ch, show: ch, id };
    });
  }

  function renderPaws(el, results, n) {
    el.innerHTML = Array.from({ length: n }, (_, i) => {
      const r = results[i];
      return `<span class="paw${r ? " got" : ""}${r === "gold" ? " gold" : ""}">${r ? "🐾" : ""}</span>`;
    }).join("");
  }

  function startRound(act) {
    stopSpeech();
    if (act === "name" && !Pip.settings.first.trim()) { say("Ask a grown-up to add your name first!"); Pip.openGrownups(); return; }
    const items = buildRound(act);
    if (!items.length) return;
    game = { act, level: levels[act], items, i: 0, results: [], good: 0 };
    show("play");
    renderPaws($("#paws"), game.results, items.length);
    renderStrip();
    startLetter();
  }

  function renderStrip() {
    const strip = $("#strip");
    strip.hidden = game.act !== "name";
    if (strip.hidden) return;
    strip.innerHTML = game.items.map((it, i) => `<span class="${i < game.i ? "done" : i === game.i ? "now" : ""}">${it.show.replace(/</g, "&lt;")}</span>`).join("");
  }

  const kindWord = ch => (/\d/.test(ch) ? "number" : ch === ch.toUpperCase() ? "big letter" : "small letter");
  const sayChar = ch => (/\d/.test(ch) ? NUM_WORDS[+ch] : L(ch));

  function startLetter() {
    const it = game.items[game.i];
    T = { it, strokes: [], cur: 0, prog: 0, active: false, slips: 0, misses: 0, off: false, missedThisStroke: false, locked: false, lastTalk: 0 };
    $("#model").innerHTML = `${it.show.replace(/</g, "&lt;")}<small>${/\d/.test(it.ch) ? "number" : it.ch === it.ch.toUpperCase() ? "big" : "small"}</small>`;
    renderStrip();
    drawBoard();
    $("#prompt").textContent = game.act === "name" ? "Write your name!" : `Trace the ${kindWord(it.ch)} ${it.show}`;
    intro();
  }
  function introText() {
    const it = T.it;
    if (game.act === "name") return game.i === 0 ? `Let's write your name! First, the big letter ${sayChar(it.ch)}. Start at the green dot.` : `Next, ${sayChar(it.ch)}.`;
    return `Trace the ${kindWord(it.ch)} ${sayChar(it.ch)}. Start at the green dot.`;
  }
  function intro() { say(introText()); }

  /* ---------- Drawing the board ---------- */
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    if (parent) parent.appendChild(e);
    return e;
  }
  function drawBoard() {
    const svg = $("#board");
    svg.innerHTML = "";
    const lv = game.level;
    const hasTail = /[gjpqy]/.test(T.it.ch);
    // handwriting paper: top line, dashed middle, base line (and a faint tail line when needed)
    el("line", { x1: -20, x2: 120, y1: 20, y2: 20, class: "paper-line" }, svg);
    el("line", { x1: -20, x2: 120, y1: 70, y2: 70, class: "paper-mid" }, svg);
    el("line", { x1: -20, x2: 120, y1: 120, y2: 120, class: "paper-line" }, svg);
    if (hasTail) el("line", { x1: -20, x2: 120, y1: 155, y2: 155, class: "paper-desc" }, svg);
    const guides = el("g", {}, svg), trails = el("g", {}, svg);
    T.marks = el("g", {}, svg);
    T.strokes = GLYPHS[T.it.ch].map(d => {
      if (d.startsWith("dot:")) {
        const [x, y] = d.slice(4).split(",").map(Number);
        el("circle", { cx: x, cy: y, r: lv === 3 ? 2.2 : 4.5, class: "guide-dot" }, guides);
        const trail = el("circle", { cx: x, cy: y, r: 4, fill: "transparent" }, trails);
        return { dot: true, pts: [{ x, y }], trail };
      }
      const g = el("path", { d, class: "guide" + (lv === 3 ? " dotted" : ""), "stroke-width": lv === 1 ? 17 : lv === 2 ? 12 : 4 }, guides);
      const len = g.getTotalLength(), step = 2.5, pts = [];
      for (let t = 0; t <= len; t += step) { const p = g.getPointAtLength(t); pts.push({ x: p.x, y: p.y }); }
      const end = g.getPointAtLength(len); pts.push({ x: end.x, y: end.y });
      const trail = el("path", { d, class: "trail", pathLength: 1, "stroke-dasharray": "0 1" }, trails);
      return { dot: false, pts, trail };
    });
    T.snail = el("g", { class: "snail-g" }, svg);
    T.snailText = el("text", { class: "snail", x: 0, y: -12 }, T.snail); // rides just above the line so the numbered dot stays visible
    T.snailText.textContent = "🐌";
    markStroke();
  }
  // green numbered start dot and an arrow for the current stroke
  function markStroke() {
    T.marks.innerHTML = "";
    const st = T.strokes[T.cur]; if (!st) return;
    const p0 = st.pts[0];
    const g = el("g", { class: "start" }, T.marks);
    el("circle", { cx: p0.x, cy: p0.y, r: 5.5, class: "pulse" }, g);
    el("circle", { cx: p0.x, cy: p0.y, r: 5.5 }, g);
    const tx = el("text", { x: p0.x, y: p0.y }, g); tx.textContent = T.cur + 1;
    if (!st.dot) {
      const p1 = st.pts[Math.min(5, st.pts.length - 1)];
      const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
      // a little arrow just past the dot, pointing the way to go
      const ax = p0.x + Math.cos(ang) * 11, ay = p0.y + Math.sin(ang) * 11;
      el("polygon", { points: "4,0 -3,-3.5 -3,3.5", class: "arrowhead", transform: `translate(${ax} ${ay}) rotate(${ang * 180 / Math.PI})` }, T.marks);
    }
    placeSnail(p0, 1);
  }
  function placeSnail(p, dir) {
    T.snail.style.setProperty("--x", p.x + "px"); T.snail.style.setProperty("--y", p.y + "px");
    T.snail.setAttribute("transform", `translate(${p.x} ${p.y})`);
    if (dir) T.snailText.setAttribute("transform", dir > 0 ? "scale(-1 1)" : "");
  }

  /* ---------- Tracing ---------- */
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function toBoard(e) {
    const svg = $("#board"), pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: p.x, y: p.y };
  }
  function talk(text) { if (Date.now() - T.lastTalk > 3500) { T.lastTalk = Date.now(); say(text); } }

  const board = $("#board");
  board.addEventListener("pointerdown", e => {
    if (!T || T.locked) return;
    e.preventDefault();
    const tol = TOL[game.level], st = T.strokes[T.cur], p = toBoard(e);
    if (dist(p, st.pts[T.prog]) <= tol * 1.5) {
      if (st.dot) return strokeDone();
      T.active = true; T.off = false;
      board.setPointerCapture(e.pointerId);
    } else {
      // started somewhere else: point her back to the green dot (counted once per stroke)
      if (!T.missedThisStroke) { T.missedThisStroke = true; T.misses++; }
      sfx("no");
      talk(T.prog === 0 ? "Start at the green dot!" : "Keep going from the snail!");
    }
  });
  board.addEventListener("pointermove", e => {
    if (!T || !T.active || T.locked) return;
    const tol = TOL[game.level], st = T.strokes[T.cur], p = toBoard(e), pts = st.pts;
    // move the snail forward to the furthest nearby point ahead; it never goes backwards
    let best = -1;
    for (let k = T.prog; k <= Math.min(T.prog + 14, pts.length - 1); k++) if (dist(p, pts[k]) <= tol) best = k;
    if (best > T.prog) {
      const dir = Math.sign(pts[best].x - pts[T.prog].x);
      T.prog = best; T.off = false;
      st.trail.setAttribute("stroke-dasharray", `${(T.prog / (pts.length - 1)).toFixed(4)} 1`);
      placeSnail(pts[T.prog], dir);
      if (T.prog >= pts.length - 2) strokeDone();
    } else if (best < 0 && dist(p, pts[T.prog]) > tol * 2.6 && !T.off) {
      // wandered off the path: count it once until she comes back
      T.off = true; T.slips++;
      sfx("no");
      T.snail.classList.remove("wobble"); void T.snail.getBoundingClientRect(); T.snail.classList.add("wobble");
      talk("Stay on the path!");
    }
  });
  const lift = () => { if (T) T.active = false; };
  board.addEventListener("pointerup", lift);
  board.addEventListener("pointercancel", lift);

  function strokeDone() {
    const st = T.strokes[T.cur];
    if (st.dot) st.trail.setAttribute("fill", "var(--ink)");
    else { st.trail.setAttribute("stroke-dasharray", "1 0"); st.trail.classList.add("done"); }
    T.active = false; T.cur++; T.prog = 0; T.missedThisStroke = false;
    if (T.cur < T.strokes.length) {
      sfx("stroke");
      markStroke();
      say(T.strokes[T.cur].dot ? "Now tap the dot!" : `Now line ${NUM_WORDS[T.cur + 1]}!`);
      return;
    }
    letterDone();
  }

  async function letterDone() {
    const g = game, t = T;
    t.locked = true; t.marks.innerHTML = ""; t.snail.remove();
    sfx("yes"); confetti($("#board"));
    // wobbly is fine: a single slip or a single wrong start still counts as right first time
    const clean = t.slips + t.misses <= 1;
    if (t.it.id) memory.result(t.it.id, clean);
    if (clean) g.good++;
    g.results[g.i] = clean ? "gold" : "plain";
    renderPaws($("#paws"), g.results, g.items.length);
    $("#prompt").textContent = "Beautiful!";
    let line;
    if (g.act === "name") line = g.i === g.items.length - 1 ? `${Pip.settings.first}! You wrote your name!` : `${sayChar(t.it.ch)}!`;
    else line = `${cap(sayChar(t.it.ch))}! Beautiful ${/\d/.test(t.it.ch) ? "number" : "letter"}!`;
    await say(line);
    if (g !== game) return;
    await wait(500);
    if (g !== game) return;
    g.i++;
    if (g.i >= g.items.length) finishRound(); else startLetter();
  }

  function finishRound() {
    const g = game, before = levels[g.act], share = g.good / g.items.length;
    if (g.act === "name") memory.result("name:first", share >= 0.8);
    if (share >= 0.8) levels[g.act] = Math.min(3, before + 1);
    else if (share <= 0.4) levels[g.act] = Math.max(1, before - 1);
    store.set("levels", levels);
    const missing = STICKERS.filter(s => !stickers[s[0]]);
    const s = pick(missing.length ? missing : STICKERS);
    stickers[s[0]] = (stickers[s[0]] || 0) + 1;
    Pip.saveStickers();
    renderPaws($("#rewardPaws"), g.results, g.items.length);
    const box = $("#newSticker");
    box.textContent = s[0]; box.style.animation = "none"; void box.offsetWidth; box.style.animation = "";
    $("#rewardText").textContent = `You got ${article(s[1])} sticker!`;
    T = null; show("reward"); sfx("fanfare");
    const more = levels[g.act] > before ? " Your writing is getting so good!" : "";
    say(`Super writing! You got ${article(s[1])} sticker!${more}`);
  }

  /* ---------- Buttons ---------- */
  $("#againBtn").addEventListener("click", () => { if (T && !T.locked) { T.cur = 0; T.prog = 0; T.active = false; drawBoard(); say("Let's try again. Start at the green dot."); } });
  $("#homeBtn").addEventListener("click", () => goHome());
  $("#repeatBtn").addEventListener("click", () => { if (T && !T.locked) intro(); });
  $("#pipPlay").addEventListener("click", () => { if (T && !T.locked) intro(); });
  $("#playAgain").addEventListener("click", () => { if (game) startRound(game.act); });
  $("#rewardHome").addEventListener("click", () => goHome());
  $("#rewardBook").addEventListener("click", openBook);
  $("#bookBtn").addEventListener("click", openBook);
  $("#bookHome").addEventListener("click", () => goHome());
  $("#hubBtn").addEventListener("click", () => Pip.goHub());

  function openBook() {
    game = null; T = null; stopSpeech();
    const have = STICKERS.filter(s => stickers[s[0]]).length;
    $("#bookCount").textContent = `${have} / ${STICKERS.length}`;
    $("#bookGrid").innerHTML = STICKERS.map(([e, n]) => {
      const c = stickers[e] || 0;
      return `<button class="slotb ${c ? "have" : "empty"}" data-name="${n}" data-have="${c ? 1 : 0}" aria-label="${c ? n : "Sticker not found yet"}"><span>${e}</span>${c > 1 ? `<span class="n">×${c}</span>` : ""}</button>`;
    }).join("");
    show("book");
    if (interacted) say(have ? `You have ${have} sticker${have === 1 ? "" : "s"}!` : "Play a game to win your first sticker!");
  }
  $("#bookGrid").addEventListener("click", e => {
    const b = e.target.closest(".slotb"); if (!b) return;
    say(b.dataset.have === "1" ? cap(b.dataset.name) + "!" : "Keep playing to find this one!");
  });

  const PROGRESS = [
    { label: "Big letters", prefix: "up:", ids: [...SETS.big[2]] },
    { label: "Small letters", prefix: "low:", ids: [...SETS.small[2]] },
    { label: "Numbers", prefix: "num:", ids: [...SETS.numbers[2]] },
    { label: "Her name", prefix: "name:", ids: () => (Pip.settings.first ? ["first"] : []), show: () => "writing her name" }
  ];
  Pip.registerProgress("trace", PROGRESS);
  Pip.registerGame("trace", {
    enter() {
      const st = store.get("settings", {});
      settings.enabled = Object.assign({ big: true, small: true, numbers: true, name: true }, st.enabled || {});
      levels = Object.assign({ big: 1, small: 1, numbers: 1, name: 1 }, store.get("levels", {}));
      goHome();
    },
    leave() { game = null; T = null; stopSpeech(); }
  });
  renderHome();
});
</script>
