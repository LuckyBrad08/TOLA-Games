<!-- Story Time: written directly for Pip's Learning Garden (uses the shared Pip core, no standalone version) -->
<style>
/* Layout: bedtime. A night sky with a moon; each story is a row of picture pages on a warm paper band,
   with the sentence Pip is reading set large underneath. Deliberately dark, single world. */
:host {
  --night: #26305e;
  --night-low: #3d4a8c;
  --star: #fff3b0;
  --paper: #fffaf0;
  --paper-edge: #e8dcc0;
  --lamp: #ffc857;
  --lamp-deep: #e9a520;
  --ink: #2a2a44;
  --ink-soft: #5d5a72;
  --ok: #2c9c5a;
  --berry: #d9466f;
  --font-display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-read: "Andika", "Century Gothic", "Segoe UI", system-ui, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  display: block; height: 100%;
  font-family: var(--font-read); font-size: 18px; color: var(--ink);
  background: radial-gradient(circle at 85% 12%, rgba(255, 243, 176, .35) 0 60px, transparent 61px), linear-gradient(180deg, var(--night), var(--night-low));
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--lamp); outline-offset: 4px; }
.emoji { font-family: var(--emoji); line-height: 1; }

.scenery { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.moon { position: absolute; top: 5%; right: 6%; width: 74px; height: 74px; border-radius: 50%; background: var(--star); box-shadow: 0 0 40px rgba(255, 243, 176, .6); }
.moon::after { content: ""; position: absolute; width: 74px; height: 74px; border-radius: 50%; background: var(--night); left: 22px; top: -10px; }
.star { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--star); opacity: .8; animation: twinkle 3s ease-in-out infinite; }

#app { position: relative; height: 100%; }
.screen {
  height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto;
}
.center { justify-content: center; text-align: center; }
.pip { font-family: var(--emoji); line-height: 1; border: 0; border-radius: 50%; background: var(--paper); display: grid; place-items: center; box-shadow: 0 6px 0 var(--paper-edge); flex: none; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(42px, 6vw, 68px); line-height: .95; margin: 0; color: var(--lamp);
  text-shadow: 0 4px 0 #141a3a, 3px 0 0 #141a3a, -3px 0 0 #141a3a, 0 -3px 0 #141a3a; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 4vw, 44px); margin: 0; line-height: 1.1; color: var(--paper); text-wrap: balance; }
.pill { border: 0; border-radius: 999px; padding: 12px 22px; background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge);
  font-family: var(--font-display); font-weight: 800; font-size: 22px; display: inline-flex; align-items: center; gap: 10px; transition: transform .12s; }
.pill:hover { transform: translateY(-3px); }
.pill .emoji { font-size: 26px; }
.pill.soft { background: rgba(255, 250, 240, .16); color: var(--paper); box-shadow: 0 5px 0 rgba(0, 0, 0, .2); }
.badge { background: var(--lamp); border-radius: 999px; padding: 0 10px; font-size: 18px; }
.round-btn { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge); font-family: var(--emoji); font-size: 28px; display: grid; place-items: center; flex: none; }
.paws { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.paw { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.12); border: 3px dashed rgba(255,255,255,.3); display: grid; place-items: center; font-family: var(--emoji); font-size: 20px; }
.paw.got { background: var(--paper); border: 3px solid var(--paper-edge); animation: pop .4s ease; }
.paw.gold { background: var(--lamp); border-color: var(--lamp-deep); }
.btn-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

/* Home: a shelf of story books */
.home-head { display: flex; align-items: center; gap: 18px; margin-top: 1vh; }
.home-head .pip { width: 100px; height: 100px; font-size: 64px; }
.home-sub { font-family: var(--font-display); font-weight: 600; font-size: 22px; margin: 6px 0 0; color: var(--paper); }
.shelf { display: grid; grid-template-columns: repeat(6, minmax(0, 150px)); gap: 16px; justify-content: center; width: 100%; margin-top: 1vh; }
.cover { position: relative; border: 0; border-radius: 10px 18px 18px 10px; padding: 12px 8px 10px 14px; background: var(--c, #e86f68);
  box-shadow: inset 6px 0 0 rgba(0, 0, 0, .18), 0 7px 0 rgba(0, 0, 0, .25); display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 140px; transition: transform .15s; }
.cover:hover { transform: translateY(-5px) rotate(-1.5deg); }
.cover .emoji { font-size: 46px; margin-top: 4px; }
.cover .t { font-family: var(--font-display); font-weight: 800; font-size: 16px; line-height: 1.1; color: #fff; text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.cover .done { position: absolute; top: -8px; right: -8px; font-size: 26px; }
.cover.locked { filter: grayscale(.9) brightness(.55); cursor: default; }
.cover.locked .t::after { content: " 🔒"; }
.home-foot { margin-top: auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }

/* Play */
.topbar { width: 100%; max-width: 1080px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bubble-row { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 1080px; }
.bubble-row .pip { width: 66px; height: 66px; font-size: 44px; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--paper); border-radius: 24px; padding: 12px 22px;
  font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 2.8vw, 32px); line-height: 1.15; box-shadow: 0 6px 0 var(--paper-edge); text-wrap: balance; }
.bubble::before { content: ""; position: absolute; left: -14px; top: 50%; margin-top: -12px; border: 12px solid transparent; border-right: 16px solid var(--paper); border-left: 0; }
.stage { flex: 1; min-height: 0; width: 100%; max-width: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.scenes { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.scene { width: clamp(120px, 15vw, 170px); aspect-ratio: 4 / 3; border-radius: 16px; background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge);
  display: grid; place-items: center; font-family: var(--emoji); font-size: clamp(34px, 4.4vw, 52px); letter-spacing: 2px; position: relative; transition: transform .25s, opacity .25s, box-shadow .25s; opacity: .55; }
.scene.on { opacity: 1; transform: translateY(-8px) scale(1.06); box-shadow: 0 6px 0 var(--lamp-deep), 0 0 0 6px var(--lamp); }
.scene.seen { opacity: 1; }
/* pictures made of three or more emoji get a little smaller so they stay on one line */
.scene.busy, .slot.filled.busy, .card.busy { font-size: clamp(24px, 3vw, 38px); letter-spacing: 0; }
.choice .pic.busy { font-size: clamp(32px, 3.8vw, 46px); }
.scene .n { position: absolute; top: 6px; left: 8px; font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--ink-soft); letter-spacing: 0; }
.sentence { width: 100%; max-width: 900px; min-height: 2.6em; background: var(--paper); border-radius: 18px; padding: 10px 22px; text-align: center;
  font-family: var(--font-read); font-weight: 700; font-size: clamp(22px, 2.8vw, 32px); line-height: 1.3; box-shadow: 0 6px 0 var(--paper-edge); text-wrap: balance; }
.choices { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; width: 100%; }
.choice { width: clamp(130px, 15vw, 180px); min-height: 130px; border: 0; border-radius: 24px; background: var(--paper);
  box-shadow: 0 8px 0 var(--paper-edge); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px 10px; transition: transform .15s, opacity .3s; }
.choice:hover:not(:disabled) { transform: translateY(-5px); }
.choice:disabled { cursor: default; }
.choice .pic { font-family: var(--emoji); font-size: clamp(44px, 5.5vw, 64px); line-height: 1; }
.choice .cap { font-family: var(--font-read); font-weight: 700; font-size: 18px; line-height: 1.2; text-align: center; }
.choice.wrong { animation: wiggle .45s ease; opacity: .35; }
.choice.right { box-shadow: 0 8px 0 var(--ok), 0 0 0 6px var(--ok); animation: bounce .6s ease; }
.choice.hint { animation: glow 1.1s ease-in-out infinite; }
/* putting the pictures in order */
.slots { display: flex; gap: 14px; }
.slot { width: clamp(120px, 15vw, 170px); aspect-ratio: 4 / 3; border-radius: 16px; border: 4px dashed rgba(255, 250, 240, .45); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 20px; color: rgba(255, 250, 240, .7); font-family: var(--font-display); }
.slot.filled { border: 4px solid var(--ok); background: var(--paper); font-family: var(--emoji); font-size: clamp(34px, 4.4vw, 52px); letter-spacing: 2px; animation: pop .3s ease; }
.cards { display: flex; gap: 14px; }
.card { width: clamp(120px, 15vw, 170px); aspect-ratio: 4 / 3; border: 0; border-radius: 16px; background: var(--paper); box-shadow: 0 6px 0 var(--paper-edge);
  font-family: var(--emoji); font-size: clamp(34px, 4.4vw, 52px); letter-spacing: 2px; transition: transform .15s, opacity .25s; }
.card:hover:not(:disabled) { transform: translateY(-5px); }
.card.used { opacity: .15; }
.card.wrong { animation: wiggle .45s ease; }
.card.hint { animation: glow 1.1s ease-in-out infinite; }

/* Reward + book */
.eyebrow { font-family: var(--font-display); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: 18px; margin: 0; color: rgba(255, 250, 240, .75); }
.sticker-big { font-family: var(--emoji); font-size: clamp(110px, 17vw, 170px); line-height: 1; width: clamp(170px, 26vw, 250px); aspect-ratio: 1; border-radius: 50%;
  background: var(--paper); display: grid; place-items: center; border: 8px dashed var(--lamp); animation: sticker .9s cubic-bezier(.2, 1.6, .4, 1) both; }
.book-head { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 900px; }
.book-head h2 { flex: 1; }
.book { width: 100%; max-width: 900px; background: var(--paper); border-radius: 34px; padding: 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px; }
.slotb { position: relative; aspect-ratio: 1; border: 0; border-radius: 24px; background: #f2ecdc; display: grid; place-items: center; font-family: var(--emoji); font-size: 54px; line-height: 1; }
.slotb.have { background: #fff1c2; }
.slotb.empty span { filter: grayscale(1) brightness(0); opacity: .12; }
.slotb .n { position: absolute; bottom: 6px; right: 8px; font-family: var(--font-display); font-weight: 800; font-size: 16px; background: var(--lamp); border-radius: 999px; padding: 0 8px; }

.bit { position: fixed; width: 12px; height: 12px; border-radius: 3px; z-index: 7; pointer-events: none; animation: burst .9s ease-out forwards; }
@keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.5); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-18px) scale(1.05); } }
@keyframes glow { 0%, 100% { box-shadow: 0 8px 0 var(--paper-edge), 0 0 0 0 rgba(255, 200, 87, 0); } 50% { box-shadow: 0 8px 0 var(--paper-edge), 0 0 0 10px rgba(255, 200, 87, .8); } }
@keyframes twinkle { 50% { opacity: .25; } }
@keyframes sticker { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }

@media (max-width: 860px) { .shelf { grid-template-columns: repeat(3, minmax(0, 150px)); } }
/* Phone held sideways (about 760 x 360) */
@media (max-height: 520px) {
  .screen { gap: 6px; padding-block: 6px; }
  .round-btn { width: 44px; height: 44px; font-size: 21px; box-shadow: 0 4px 0 var(--paper-edge); }
  .paws { gap: 5px; }
  .paw { width: 28px; height: 28px; font-size: 14px; border-width: 2px; }
  .bubble-row .pip { width: 44px; height: 44px; font-size: 30px; box-shadow: 0 4px 0 var(--paper-edge); }
  .bubble { font-size: 18px; padding: 6px 14px; border-radius: 16px; box-shadow: 0 4px 0 var(--paper-edge); }
  .bubble::before { left: -10px; margin-top: -8px; border-width: 8px; border-right-width: 11px; }
  h1 { font-size: 30px; }
  h2 { font-size: 24px; }
  .home-head { margin-top: 0; gap: 12px; }
  .home-head .pip { width: 52px; height: 52px; font-size: 34px; box-shadow: 0 4px 0 var(--paper-edge); }
  .home-sub { font-size: 16px; margin-top: 2px; }
  .shelf { grid-template-columns: repeat(6, minmax(0, 104px)); gap: 10px; margin-top: 2px; }
  .cover { min-height: 96px; padding: 6px 6px 6px 10px; gap: 2px; }
  .cover .emoji { font-size: 30px; margin-top: 0; }
  .cover .t { font-size: 12px; }
  .cover .done { font-size: 18px; top: -6px; right: -6px; }
  .pill { padding: 8px 16px; font-size: 17px; }
  .pill .emoji { font-size: 22px; }
  .stage { gap: 6px; }
  .scenes { gap: 8px; }
  .scene, .slot, .card { width: 96px; font-size: 28px; border-radius: 12px; }
  .scene .n { font-size: 11px; top: 3px; left: 5px; }
  .scene.busy, .slot.filled.busy, .card.busy { font-size: 20px; }
  .choice .pic.busy { font-size: 28px; }
  .slot { font-size: 14px; border-width: 3px; }
  .slot.filled { font-size: 28px; border-width: 3px; }
  .slots, .cards { gap: 8px; }
  .sentence { font-size: 18px; padding: 6px 14px; border-radius: 12px; min-height: 2.4em; box-shadow: 0 4px 0 var(--paper-edge); }
  .choices { gap: 12px; }
  .choice { width: 128px; min-height: 0; padding: 8px 6px; border-radius: 18px; gap: 4px; box-shadow: 0 6px 0 var(--paper-edge); }
  .choice .pic { font-size: 38px; }
  .choice .cap { font-size: 14px; }
  .sticker-big { width: 120px; font-size: 76px; border-width: 6px; }
  .eyebrow { font-size: 14px; }
  .book { padding: 14px; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); }
  .slotb { font-size: 42px; border-radius: 18px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="scenery" aria-hidden="true" id="sky"><div class="moon"></div></div>

<div id="app">
  <section id="home" class="screen">
    <div class="home-head">
      <button class="pip" id="pipHome" aria-label="Pip the panda says hello">🐼</button>
      <div>
        <h1>Story Time</h1>
        <p class="home-sub">Pick a story and listen carefully!</p>
      </div>
    </div>
    <div class="shelf" id="shelf"></div>
    <div class="home-foot">
      <button class="pill" id="bookBtn"><span class="emoji">⭐</span> Stickers <span class="badge" id="stickerCount">0</span></button>
      <button class="pill" id="hubBtn"><span class="emoji">🗺️</span> All games</button>
    </div>
  </section>

  <section id="play" class="screen" hidden>
    <div class="topbar">
      <button class="round-btn" id="homeBtn" aria-label="Back to the story shelf">🏠</button>
      <div class="paws" id="paws" aria-label="Progress"></div>
      <button class="round-btn" id="repeatBtn" aria-label="Hear the question again">🔊</button>
    </div>
    <div class="bubble-row">
      <button class="pip" id="pipPlay" aria-label="Hear it again">🐼</button>
      <div class="bubble" id="prompt" aria-live="polite"></div>
    </div>
    <div class="stage" id="stage"></div>
  </section>

  <section id="reward" class="screen center" hidden>
    <p class="eyebrow">The end</p>
    <div class="paws" id="rewardPaws"></div>
    <div class="sticker-big" id="newSticker"></div>
    <h2 id="rewardText"></h2>
    <div class="btn-row">
      <button class="pill" id="playAgain"><span class="emoji">📖</span> Another story</button>
      <button class="pill" id="rewardBook"><span class="emoji">⭐</span> Stickers</button>
      <button class="pill" id="rewardHome"><span class="emoji">🏠</span> Story shelf</button>
    </div>
  </section>

  <section id="book" class="screen" hidden>
    <div class="book-head">
      <button class="round-btn" id="bookHome" aria-label="Back to the story shelf">🏠</button>
      <h2>My sticker book</h2>
      <span class="badge" id="bookCount" style="font-size:22px;font-family:var(--font-display);font-weight:800"></span>
    </div>
    <div class="book" id="bookGrid"></div>
  </section>
</div>

<script>
Pip.defineGame("story", (root, host) => {
  "use strict";
  const $ = s => root.querySelector(s);
  const rand = n => Math.floor(Math.random() * n);
  const pick = a => a[rand(a.length)];
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const article = w => (/^[aeiou]/i.test(w) ? "an " : "a ") + w;
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const { say, sayQueue, stopSpeech } = Pip;
  const store = Pip.storeFor("story");
  const memory = Pip.memoryFor("story");
  const stickers = Pip.stickers;
  let level = store.get("level", 1);
  const STICKERS = [
    ["🦁", "lion"], ["🐯", "tiger"], ["🐻", "bear"], ["🐼", "panda"], ["🐨", "koala"], ["🐵", "monkey"],
    ["🦊", "fox"], ["🐰", "bunny"], ["🐸", "frog"], ["🐷", "pig"], ["🐮", "cow"], ["🐔", "hen"],
    ["🐧", "penguin"], ["🦉", "owl"], ["🦄", "unicorn"], ["🐙", "octopus"], ["🐳", "whale"], ["🐬", "dolphin"],
    ["🦒", "giraffe"], ["🦓", "zebra"], ["🐘", "elephant"], ["🦛", "hippo"], ["🐢", "turtle"], ["🦜", "parrot"]
  ];

  /* ---------- The stories ----------
     {N} is her name (from the Grown-ups corner). Each question lists its options with the right one first
     (they are shuffled on screen), the scene that holds the answer (for "listen again" help), and what Pip
     says when she gets it. Every story also gets a "put the pictures in order" question. */
  const STORIES = [
    { id: "carrots", lvl: 1, c: "#e8836b", title: "Bunny's Carrots", cover: "🐰",
      scenes: [["🐰🌅", "Bunny woke up very hungry."], ["🥕❓", "She hopped to the garden, but her carrots were gone!"], ["🦊🧺", "Then Fox came along with a basket. He had picked the carrots, so they could eat them together."]],
      qs: [{ t: "who", q: "Who had the carrots?", o: [["🦊", "Fox"], ["🐻", "Bear"], ["🐭", "Mouse"]], s: 2, yes: "Yes! Fox had picked the carrots." },
           { t: "feel", q: "How did Bunny feel when her carrots were gone?", o: [["😢", "sad"], ["😀", "happy"], ["😴", "sleepy"]], s: 1, yes: "Yes! Bunny felt sad, because she was hungry and the carrots were gone." }] },
    { id: "puddle", lvl: 1, c: "#5b9bd5", title: "Duck's Puddle", cover: "🦆",
      scenes: [["🌧️🏡", "It rained all night on the farm."], ["🦆💧", "In the morning, Duck found a big puddle."], ["🦆💦", "Duck splashed and splashed. What fun!"]],
      qs: [{ t: "what", q: "What did Duck find?", o: [["💧", "a puddle"], ["⚽", "a ball"], ["🎂", "a cake"]], s: 1, yes: "Yes! Duck found a big puddle." },
           { t: "feel", q: "How did Duck feel, splashing in the puddle?", o: [["😀", "happy"], ["😨", "scared"], ["😢", "sad"]], s: 2, yes: "Yes! Duck was happy. Splashing is fun!" }] },
    { id: "kitten", lvl: 1, c: "#8e6fd6", title: "{N} and the Kitten", cover: "🐱",
      scenes: [["👧🌳", "{N} was playing in the park."], ["🐱🌲", "She heard a little meow. A kitten was stuck up a tree!"], ["👧🐱💛", "{N} helped the kitten climb down safely."]],
      qs: [{ t: "where", q: "Where was the kitten stuck?", o: [["🌲", "up a tree"], ["🏠", "on a roof"], ["🚗", "in a car"]], s: 1, yes: "Yes! The kitten was stuck up a tree." },
           { t: "feel", q: "How did the kitten feel, stuck up the tree?", o: [["😨", "scared"], ["😀", "happy"], ["😴", "sleepy"]], s: 1, yes: "Yes! The kitten was scared, until {N} helped." }] },
    { id: "birthday", lvl: 1, c: "#e05c8a", title: "Bear's Birthday", cover: "🐻",
      scenes: [["🐻🎂", "It was Bear's birthday."], ["🐰🐭🦊🎁", "His friends came with presents."], ["🐻🎈", "Bear blew out the candles, and everyone sang."]],
      qs: [{ t: "what", q: "What special day was it?", o: [["🎂", "a birthday"], ["🌧️", "a rainy day"], ["🏫", "a school day"]], s: 0, yes: "Yes! It was Bear's birthday." },

           { t: "who", q: "Who became Tortoise's friend?", o: [["🐸", "Frog"], ["🐟", "Fish"], ["🦆", "Duck"]], s: 2, yes: "Yes! Frog became his friend." },
           { t: "feel", q: "How does Tortoise feel now?", o: [["😄", "happy"], ["😔", "lonely"], ["😨", "scared"]], s: 4, yes: "Yes! Now he has a friend, he feels happy." },
           { t: "next", q: "What might they do tomorrow?", o: [["🐢🐸", "Play together again"], ["🏔️", "Climb a mountain"], ["🚂", "Drive a train"]], s: 4, yes: "Yes! They might play together again." }] }
  ];
  const Q_NAMES = { who: "who", what: "what", where: "where", order: "story order", feel: "feelings", why: "why", word: "story words", next: "what next" };

  // her name goes into the stories; until a grown-up adds it, the girl in the story is called Mia
  const busy = pic => ((pic.match(/\p{Extended_Pictographic}/gu) || []).length >= 3 ? " busy" : "");
  const heroName = () => Pip.settings.first.trim() || "Mia";
  const fill = s => s.replace(/\{N\}/g, heroName());

  /* ---------- Sound effects ---------- */
  let actx = null;
  function tone(f, t, d, type = "triangle", v = 0.15) {
    v *= window.speechSynthesis && speechSynthesis.speaking ? 0.3 : 0.6;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + 0.05);
  }
  function sfx(kind) {
    if (!Pip.settings.sfx) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      const now = actx.currentTime;
      if (kind === "page") tone(880, now, 0.08, "sine", 0.08);
      else if (kind === "yes") [523, 659, 784].forEach((f, i) => tone(f, now + i * 0.09, 0.2));
      else if (kind === "no") { tone(330, now, 0.15, "sine", 0.12); tone(262, now + 0.14, 0.22, "sine", 0.12); }
      else if (kind === "fanfare") [523, 659, 784, 1047].forEach((f, i) => tone(f, now + i * 0.13, i === 3 ? 0.6 : 0.16));
    } catch (e) {}
  }
  function confetti(el) {
    if (reduceMotion || !el) return;
    const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 22; i++) {
      const b = document.createElement("span"); b.className = "bit";
      const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 120;
      b.style.left = cx + "px"; b.style.top = cy + "px"; b.style.background = pick(["#ffc857", "#fff3b0", "#e05c8a", "#5b9bd5", "#4caf7a"]);
      b.style.setProperty("--dx", Math.cos(a) * d + "px"); b.style.setProperty("--dy", Math.sin(a) * d - 40 + "px");
      root.appendChild(b); setTimeout(() => b.remove(), 950);
    }
  }
  // a few twinkling stars
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("span"); s.className = "star";
    s.style.left = rand(100) + "%"; s.style.top = rand(55) + "%"; s.style.animationDelay = -rand(30) / 10 + "s";
    $("#sky").appendChild(s);
  }

  /* ---------- Screens ---------- */
  const screens = ["home", "play", "reward", "book"];
  function show(id) { screens.forEach(s => { $("#" + s).hidden = s !== id; }); }
  let interacted = false;
  window.addEventListener("pointerdown", () => { interacted = true; }, { once: true });
  const heard = () => store.get("heard", {});

  function renderHome() {
    const done = heard();
    $("#shelf").innerHTML = STORIES.map(st => {
      const locked = st.lvl > level;
      return `<button class="cover${locked ? " locked" : ""}" data-id="${st.id}" style="--c:${st.c}" aria-label="${esc(fill(st.title))}${locked ? " (not yet)" : ""}">`
        + `<span class="emoji">${st.cover}</span><span class="t">${esc(fill(st.title))}</span>${done[st.id] ? `<span class="done emoji">⭐</span>` : ""}</button>`;
    }).join("");
    $("#stickerCount").textContent = Object.keys(stickers).length;
  }
  function goHome(speak = true) { game = null; stopSpeech(); renderHome(); show("home"); if (speak && interacted) say("Which story shall we read?"); }
  $("#shelf").addEventListener("click", e => {
    const b = e.target.closest(".cover"); if (!b) return;
    const st = STORIES.find(s => s.id === b.dataset.id);
    if (st.lvl > level) { say("That story is for later. Read some of the others first!"); return; }
    startStory(st);
  });
  $("#shelf").addEventListener("mouseover", e => {
    const b = e.target.closest(".cover");
    if (b && interacted && !game && b.dataset.id !== lastHover) { lastHover = b.dataset.id; say(fill(STORIES.find(s => s.id === b.dataset.id).title)); }
  });
  let lastHover = null;
  $("#pipHome").addEventListener("click", () => say("Pick a story! I'll read it to you, then I'll ask you some questions. Listen carefully!"));

  /* ---------- A story ---------- */
  let game = null;
  function startStory(st) {
    stopSpeech();
    // questions: the story's own (fewer on short stories), plus putting three pictures in order
    const qs = st.qs.slice(0, st.lvl === 1 ? 2 : 3).concat(st.lvl === 3 ? st.qs.slice(3) : []);
    qs.splice(1, 0, { t: "order" });
    game = { st, qs, i: 0, results: [], good: 0, phase: "listen" };
    show("play");
    renderPaws($("#paws"), game.results, qs.length);
    readStory();
  }
  function pickStory() {
    const open = STORIES.filter(s => s.lvl <= level);
    const id = memory.pick(open.map(s => "story:" + s.id), 1)[0].slice(6);
    return STORIES.find(s => s.id === id);
  }

  function renderPaws(el, results, n) {
    el.innerHTML = Array.from({ length: n }, (_, i) => {
      const r = results[i];
      return `<span class="paw${r ? " got" : ""}${r === "gold" ? " gold" : ""}">${r ? "🐾" : ""}</span>`;
    }).join("");
  }

  async function readStory() {
    const g = game, st = g.st;
    g.phase = "listen";
    $("#prompt").textContent = `${fill(st.title)}. Listen!`;
    $("#stage").innerHTML = `<div class="scenes">${st.scenes.map((sc, i) => `<div class="scene${busy(sc[0])}" data-i="${i}"><span class="n">${i + 1}</span>${sc[0]}</div>`).join("")}</div>`
      + `<div class="sentence" id="sentence"></div>`;
    const cards = [...root.querySelectorAll(".scene")];
    const light = i => () => {
      cards.forEach((c, j) => { c.classList.toggle("on", i === j); if (j < i) c.classList.add("seen"); });
      $("#sentence").textContent = fill(st.scenes[i][1]);
      sfx("page");
    };
    stopSpeech();
    const tok = await sayQueue([`${fill(st.title)}.`]);
    if (g !== game || !tok) return;
    // each page stays up at least as long as it takes to read aloud, even if the voice can't speak
    for (let i = 0; i < st.scenes.length; i++) {
      const text = fill(st.scenes[i][1]), t0 = Date.now();
      light(i)();
      const ok = await sayQueue([text]);
      if (g !== game || !ok) return;
      const min = 1200 + text.length * 45;
      if (Date.now() - t0 < min) await wait(min - (Date.now() - t0));
      if (g !== game || g.phase !== "listen") return;
    }
    cards.forEach(c => { c.classList.remove("on"); c.classList.add("seen"); });
    await wait(500);
    if (g !== game) return;
    await say("The end! Now, let's see what you remember.");
    if (g !== game || g.phase !== "listen") return;
    askQuestion();
  }

  function askQuestion() {
    const g = game, st = g.st, q = g.qs[g.i];
    g.phase = "ask";
    g.q = { def: q, wrongs: 0, locked: false };
    if (q.t === "order") return askOrder();
    const opts = shuffle(q.o.map((o, i) => ({ pic: o[0], cap: fill(o[1]), correct: i === 0 })));
    $("#prompt").textContent = fill(q.q);
    $("#stage").innerHTML = `<div class="choices" id="choices"></div><button class="pill soft" id="again"><span class="emoji">🔁</span> Hear the story again</button>`;
    opts.forEach(o => {
      const b = document.createElement("button");
      b.className = "choice"; b.dataset.right = o.correct ? "1" : "0";
      b.innerHTML = `<span class="pic${busy(o.pic)}">${o.pic}</span><span class="cap">${esc(o.cap)}</span>`;
      b.setAttribute("aria-label", o.cap);
      b.addEventListener("click", () => answer(b, o));
      $("#choices").appendChild(b);
    });
    $("#again").addEventListener("click", () => { g.helpedAt = g.i; readStory(); });
    say(fill(q.q));
  }

  async function answer(btn, o) {
    const g = game, q = g.q;
    if (!g || q.locked || btn.disabled) return;
    if (o.correct) {
      q.locked = true;
      root.querySelectorAll(".choice").forEach(b => { b.classList.remove("hint"); if (b !== btn) b.disabled = true; });
      btn.classList.add("right"); sfx("yes"); confetti(btn);
      await done(q.wrongs === 0, fill(q.def.yes));
    } else {
      q.wrongs++;
      btn.disabled = true; btn.classList.add("wrong"); sfx("no");
      const scene = fill(g.st.scenes[q.def.s][1]);
      if (q.wrongs >= 2) {
        root.querySelector('.choice[data-right="1"]').classList.add("hint");
        say(`Listen: ${scene}`);
      } else say(`Hmm, not ${o.cap}. Listen again: ${scene}`);
    }
  }

  // put three of the story's pictures in order: what happened first, next and last
  function askOrder() {
    const g = game, sc = g.st.scenes;
    const idx = sc.length === 3 ? [0, 1, 2] : [0, Math.floor(sc.length / 2), sc.length - 1];
    g.q.need = 0; g.q.idx = idx; g.q.wrongHere = 0;
    $("#prompt").textContent = "Put the pictures in order!";
    $("#stage").innerHTML = `<div class="slots">${["first", "next", "last"].map(w => `<div class="slot">${w}</div>`).join("")}</div>`
      + `<div class="cards">${shuffle(idx.map((s, k) => ({ s, k }))).map(c => `<button class="card${busy(sc[c.s][0])}" data-k="${c.k}" aria-label="picture ${c.s + 1}">${sc[c.s][0]}</button>`).join("")}</div>`;
    root.querySelectorAll(".card").forEach(b => b.addEventListener("click", () => orderTap(b)));
    say("Put the pictures in order. What happened first?");
  }
  async function orderTap(b) {
    const g = game, q = g.q;
    if (!g || q.locked || b.disabled) return;
    const k = +b.dataset.k;
    if (k === q.need) {
      b.disabled = true; b.classList.add("used"); b.classList.remove("hint");
      const slot = root.querySelectorAll(".slot")[k];
      slot.className = "slot filled" + busy(g.st.scenes[q.idx[k]][0]); slot.textContent = g.st.scenes[q.idx[k]][0];
      sfx("page"); q.need++; q.wrongHere = 0;
      if (q.need < 3) { say(q.need === 1 ? "Yes! What happened next?" : "And what happened last?"); return; }
      q.locked = true; sfx("yes"); confetti($(".slots"));
      const told = q.idx.map(s => fill(g.st.scenes[s][1]));
      await done(q.wrongs === 0, `Yes! First, ${told[0]} Next, ${told[1]} Last, ${told[2]}`);
    } else {
      q.wrongs++; q.wrongHere++;
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); sfx("no");
      if (q.wrongHere >= 2) { root.querySelector(`.card[data-k="${q.need}"]`).classList.add("hint"); say(`Listen: ${fill(g.st.scenes[q.idx[q.need]][1])}`); }
      else say(["Hmm. What happened at the very start?", "Not that one. What happened in the middle?", "What happened at the end?"][q.need]);
    }
  }

  async function done(first, line) {
    const g = game, t = g.qs[g.i].t;
    first = first && g.helpedAt !== g.i; // hearing the story again is fine, but then it isn't first time
    memory.result("q:" + t, first);
    if (first) g.good++;
    g.results[g.i] = first ? "gold" : "plain";
    renderPaws($("#paws"), g.results, g.qs.length);
    $("#prompt").textContent = "Well done!";
    await say(line);
    if (g !== game) return;
    await wait(600);
    if (g !== game) return;
    g.i++;
    if (g.i >= g.qs.length) finishRound(); else askQuestion();
  }

  function finishRound() {
    if (Pip.roundDone) Pip.roundDone(); // lets Pip's 5 minutes know this round is over
    const g = game, share = g.good / g.qs.length, before = level;
    memory.result("story:" + g.st.id, share >= 0.75);
    const h = heard(); h[g.st.id] = true; store.set("heard", h);
    // a new shelf of stories opens when she understands most of a story at her level
    if (share >= 0.75 && g.st.lvl >= level) level = Math.min(3, level + 1);
    store.set("level", level);
    const missing = STICKERS.filter(s => !stickers[s[0]]);
    const s = pick(missing.length ? missing : STICKERS);
    stickers[s[0]] = (stickers[s[0]] || 0) + 1;
    Pip.saveStickers();
    renderPaws($("#rewardPaws"), g.results, g.qs.length);
    const box = $("#newSticker");
    box.textContent = s[0]; box.style.animation = "none"; void box.offsetWidth; box.style.animation = "";
    $("#rewardText").textContent = `You got ${article(s[1])} sticker!`;
    show("reward"); sfx("fanfare");
    const more = level > before ? " And there are new stories on the shelf!" : "";
    say(`Great listening! You got ${article(s[1])} sticker!${more}`);
  }

  /* ---------- Buttons ---------- */
  $("#homeBtn").addEventListener("click", () => goHome());
  const replay = () => {
    if (!game) return;
    if (game.phase === "listen") readStory();
    else if (game.q && !game.q.locked) say(game.qs[game.i].t === "order" ? "Put the pictures in order." : fill(game.qs[game.i].q));
  };
  $("#repeatBtn").addEventListener("click", replay);
  $("#pipPlay").addEventListener("click", replay);
  $("#playAgain").addEventListener("click", () => startStory(pickStory()));
  $("#rewardHome").addEventListener("click", () => goHome());
  $("#rewardBook").addEventListener("click", openBook);
  $("#bookBtn").addEventListener("click", openBook);
  $("#bookHome").addEventListener("click", () => goHome());
  $("#hubBtn").addEventListener("click", () => Pip.goHub());

  function openBook() {
    game = null; stopSpeech();
    const have = STICKERS.filter(s => stickers[s[0]]).length;
    $("#bookCount").textContent = `${have} / ${STICKERS.length}`;
    $("#bookGrid").innerHTML = STICKERS.map(([e, n]) => {
      const c = stickers[e] || 0;
      return `<button class="slotb ${c ? "have" : "empty"}" data-name="${n}" data-have="${c ? 1 : 0}" aria-label="${c ? n : "Sticker not found yet"}"><span>${e}</span>${c > 1 ? `<span class="n">×${c}</span>` : ""}</button>`;
    }).join("");
    show("book");
    if (interacted) say(have ? `You have ${have} sticker${have === 1 ? "" : "s"}!` : "Listen to a story to win your first sticker!");
  }
  $("#bookGrid").addEventListener("click", e => {
    const b = e.target.closest(".slotb"); if (!b) return;
    say(b.dataset.have === "1" ? cap(b.dataset.name) + "!" : "Keep playing to find this one!");
  });

  Pip.registerProgress("story", [
    { label: "Understanding stories", prefix: "q:", ids: Object.keys(Q_NAMES), show: t => Q_NAMES[t] },
    { label: "Stories heard", prefix: "story:", ids: STORIES.map(s => s.id), show: id => fill(STORIES.find(s => s.id === id).title) }
  ]);
  Pip.registerGame("story", {
    enter() { level = store.get("level", 1); goHome(); },
    leave() { game = null; stopSpeech(); },
    play() { startStory(pickStory()); }
  });
  renderHome();
});
</script>
